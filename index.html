function train(id){if(S.tp<1)return;const p=P(id),cap=CAPS[p.rar||'N'];if(p.ovr>=cap)return;const k=AK[Math.floor(Math.random()*7)],g=1+Math.floor(Math.random()*3),o=Math.round(p.ovr);p.a[k]=Math.min(Math.max(99,cap),p.a[k]+g);{const nv=Math.min(cap,Math.round(p.ovr)+1);if(calcOvr(p)<nv)fitAttrs(p,nv);p.ovr=Math.min(cap,Math.max(nv,calcOvr(p)))}S.tp--;S.trmsg=`${p.n}: ${AN[k]} +${g} · OVR ${o} → ${Math.round(p.ovr)}`;save();draw()}

async function checkAdmin(){if(!SS){ADMOK=false;return}try{const t=await tok();const r=await sb('/rest/v1/rpc/sou_admin',{method:'POST',body:'{}'},t);ADMOK=r.ok&&r.j===true}catch(e){ADMOK=false}if(tab=='rank'&&!M)draw()}
async function claimGifts(){if(!SS)return;try{const t=await tok();if(!t)return;
 const l=await sb('/rest/v1/rpc/resgatar_limpeza',{method:'POST',body:'{}'},t);
 if(l.ok&&l.j===true){const k={org:S.org,cc:S.cc};S=def();S.org=k.org;S.cc=k.cc;S.bxmsg='🧹 Sua conta foi limpa pelo ADM.';try{localStorage.setItem('hv_q','[]')}catch(e){}save();ghostDirty=1;if(!M)draw();return}
 const r=await sb('/rest/v1/rpc/resgatar_presentes',{method:'POST',body:'{}'},t);
 if(r.ok&&Array.isArray(r.j)&&r.j.length){const m=[];r.j.forEach(g=>{const q=+g.out_qtd;if(g.out_tipo=='moedas'){tx('Presente do ADM',q);m.push(fm(q))}else if(g.out_tipo=='caixas'){S.boxes+=q;m.push(q+' caixa(s)')}else if(g.out_tipo=='jogador'&&ADMS[q]){if(S.pl[q]){tx('ADM repetido',5e6);m.push('ADM repetido ('+fm(5e6)+')')}else{S.pl[q]=mkAdm(q);S.own.push(q);m.push('jogador '+ADMS[q][0])}}});S.bxmsg='🎁 Presente do ADM: '+m.join(' + ');save();if(!M)draw()}}catch(e){}}

function mapStat(id,w,rw,rl){S.mapst=S.mapst||{};const o=S.mapst[id]||(S.mapst[id]={w:0,l:0,rw:0,rl:0});if(w)o.w++;else o.l++;o.rw+=rw;o.rl+=rl}
function mapTag(i){const st=S.mapst||{},rows=MAPS.map((m,k)=>{const o=st[k]||{w:0,l:0,rw:0,rl:0},rt=o.rw+o.rl;return{k,o,g:o.w+o.l,wr:rt?o.rw/rt:null}}),pl=rows.filter(r=>r.g>0);let best=null,worst=null;if(pl.length>=2){best=pl.reduce((a,b)=>b.wr>a.wr?b:a);worst=pl.reduce((a,b)=>b.wr<a.wr?b:a);if(best===worst)best=worst=null}const r=rows[i];return{r,tag:best&&best.k==i?'best':worst&&worst.k==i?'worst':''}}
