function nick(){const used=new Set(S.mk.map(p=>p.n).concat(Object.values(S.pl).map(p=>p.n)));for(let i=0;i<80;i++){const n=NP[Math.floor(Math.random()*NP.length)];if(!used.has(n))return n}let n;do{n=NP[Math.floor(Math.random()*NP.length)]+(10+Math.floor(Math.random()*90))}while(used.has(n));return n}
function migrate(){S.mk.concat(Object.values(S.pl)).forEach(p=>{if(!p.nk){p.n=p.id<50?NICK50[p.id]:nick();p.nk=1}const c=CAPS[p.rar||'N'],m=Math.max(99,c);if(p.ovr>c)p.ovr=c;for(const k in p.a)if(p.a[k]>m)p.a[k]=m})}
function mkAdm(id){const v=ADMS[id],p=build(id,v[0],v[1],150,3000000);p.rar='A';p.nk=1;p.pot=150;return p}
function boxPrize(){const r=Math.random()*100;return r<10?['c',1e6]:r<30?['t',10]:r<90?['c',5e5]:r<97?['c',1e7]:['a',0]}
function openBox(buy){if(buy){const d=new Date().toISOString().slice(0,10);if(!S.bxd||S.bxd.d!=d)S.bxd={d,n:0};if(S.bxd.n>=3)return alert('Limite de 3 caixas compradas por dia. Volte amanhã!');if(S.money<1e6)return alert('Saldo insuficiente');S.bxd.n++;tx('Caixa Voltrix',-1e6)}else{if(S.boxes<1)return;S.boxes--}
 const[t,v]=boxPrize();let m;
 if(t=='c'){tx('Prêmio da caixa',v);m='Você ganhou '+fm(v)+'!'}else if(t=='t'){S.tp+=10;m='Você ganhou 10 pontos de treino!'}
 else{const ids=Object.keys(ADMS).map(Number),id=ids[Math.floor(Math.random()*ids.length)];if(S.pl[id]){tx('Caixa: ADM repetido',5e6);m='ADM repetido, convertido em '+fm(5e6)}else{const p=mkAdm(id);S.pl[id]=p;S.own.push(id);m='🌟 JOGADOR ADM: '+p.n+'!'}}
 S.bxmsg=m;save();draw()}
function train(id){if(S.tp<1)return;const p=P(id),cap=CAPS[p.rar||'N'];if(p.ovr>=cap)return;const k=AK[Math.floor(Math.random()*7)],g=1+Math.floor(Math.random()*3),o=Math.round(p.ovr);p.a[k]=Math.min(Math.max(99,cap),p.a[k]+g);p.ovr=Math.min(cap,p.ovr+1);S.tp--;S.trmsg=`${p.n}: ${AN[k]} +${g} · OVR ${o} → ${Math.round(p.ovr)}`;save();draw()}
function boxV(){return bn('fin','CAIXA')+`<div class="card"><b>Caixa Voltrix</b><div class="sub" style="margin:6px 0">Preço: ${fm(1e6)} (limite de 3 compras por dia) · Você tem: <b>${S.boxes}</b> caixa(s)</div><div class="sub">60% $500.000 · 10% $1.000.000 · 7% $10.000.000 · 20% 10 pontos de treino · 3% jogador ADM</div>${S.bxmsg?`<div class="w" style="margin-top:8px">${S.bxmsg}</div>`:''}<div class="row" style="margin-top:10px"><button ${S.money<1e6?'disabled':''} onclick="openBox(1)">Comprar e abrir</button><button class="g" ${S.boxes<1?'disabled':''} onclick="openBox(0)">Abrir caixa (${S.boxes})</button></div></div>
<div class="card"><b>Treinamento</b><div style="margin:6px 0">Pontos de treino: <b>${S.tp}</b></div><div class="sub">Cada ponto melhora um atributo aleatório e +1 OVR de um jogador, até o limite da raridade.</div>${S.trmsg?`<div class="w" style="margin-top:8px">${S.trmsg}</div>`:''}</div>`+(S.own.length?S.own.map(P).map(p=>`<div class="card"><div class="row"><div><b>${p.n}</b> <span class="tag">${p.f}</span><br><span class="sub">OVR ${Math.round(p.ovr)} / limite ${CAPS[p.rar||'N']}</span></div><button ${S.tp<1||p.ovr>=CAPS[p.rar||'N']?'disabled':''} onclick="train(${p.id})">Treinar</button></div></div>`).join(''):'<div class="card sub">Contrate jogadores para treinar.</div>')}
let ADMOK=false;
async function checkAdmin(){if(!SS){ADMOK=false;return}try{const t=await tok();const r=await sb('/rest/v1/rpc/sou_admin',{method:'POST',body:'{}'},t);ADMOK=r.ok&&r.j===true}catch(e){ADMOK=false}if(tab=='rank'&&!M)draw()}
async function claimGifts(){if(!SS)return;try{const t=await tok();if(!t)return;
 const l=await sb('/rest/v1/rpc/resgatar_limpeza',{method:'POST',body:'{}'},t);
 if(l.ok&&l.j===true){const k={org:S.org,cc:S.cc};S=def();S.org=k.org;S.cc=k.cc;S.bxmsg='🧹 Sua conta foi limpa pelo ADM.';try{localStorage.setItem('hv_q','[]')}catch(e){}save();ghostDirty=1;if(!M)draw();return}
 const r=await sb('/rest/v1/rpc/resgatar_presentes',{method:'POST',body:'{}'},t);
 if(r.ok&&Array.isArray(r.j)&&r.j.length){const m=[];r.j.forEach(g=>{const q=+g.out_qtd;if(g.out_tipo=='moedas'){tx('Presente do ADM',q);m.push(fm(q))}else if(g.out_tipo=='caixas'){S.boxes+=q;m.push(q+' caixa(s)')}else if(g.out_tipo=='jogador'&&ADMS[q]){if(S.pl[q]){tx('ADM repetido',5e6);m.push('ADM repetido ('+fm(5e6)+')')}else{S.pl[q]=mkAdm(q);S.own.push(q);m.push('jogador '+ADMS[q][0])}}});S.bxmsg='🎁 Presente do ADM: '+m.join(' + ');save();if(!M)draw()}}catch(e){}}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let tsub='sq',ON={list:null,cur:null,det:null,msg:'',vp:null,vb:[]};const TAXA=1500000;
const snapP=p=>({n:p.n,f:p.f,ovr:p.ovr,a:p.a,agSel:p.ag||null});
function snapT(){return{equipe:S.org,pais:S.cc,elenco:S.st.map(P).map(p=>({n:p.n,f:p.f,ovr:Math.round(p.ovr*10)/10,a:Object.fromEntries(AK.map(k=>[k,Math.round(p.a[k]*10)/10])),ag:S.ag[p.id]||null})),estr:{ha:S.ha,hd:S.hd}}}
function stratHtml(){const on=M&&M.on;return`<div class="row" style="margin-top:6px;gap:6px"><label class="sub" style="flex:1">Ataque<select id="sa" ${on?'disabled':''} onchange="S.ha=this.value;save()">${STR_A.map(x=>`<option ${x==S.ha?'selected':''}>${x}</option>`).join('')}</select></label><label class="sub" style="flex:1">Defesa<select id="sd" ${on?'disabled':''} onchange="S.hd=this.value;save()">${STR_D.map(x=>`<option ${x==S.hd?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="sub" style="text-align:center">${on?'Estratégias travadas no torneio online.':'Mudanças valem a partir do próximo round.'}</div>`}
function mapStat(id,w,rw,rl){S.mapst=S.mapst||{};const o=S.mapst[id]||(S.mapst[id]={w:0,l:0,rw:0,rl:0});if(w)o.w++;else o.l++;o.rw+=rw;o.rl+=rl}
function mapTag(i){const st=S.mapst||{},rows=MAPS.map((m,k)=>{const o=st[k]||{w:0,l:0,rw:0,rl:0},rt=o.rw+o.rl;return{k,o,g:o.w+o.l,wr:rt?o.rw/rt:null}}),pl=rows.filter(r=>r.g>0);let best=null,worst=null;if(pl.length>=2){best=pl.reduce((a,b)=>b.wr>a.wr?b:a);worst=pl.reduce((a,b)=>b.wr<a.wr?b:a);if(best===worst)best=worst=null}const r=rows[i];return{r,tag:best&&best.k==i?'best':worst&&worst.k==i?'worst':''}}
function mapsV(){return`<div class="card"><b>Mapas da equipe</b><div class="sub" style="margin:4px 0 8px">O mapa de cada partida é sorteado automaticamente. Veja onde sua equipe rende mais.</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${MAPS.map((m,i)=>{const t=mapTag(i),r=t.r;return`<div style="text-align:center;border:1px solid ${t.tag=='best'?'#37d67a':t.tag=='worst'?'#ff4d6d':'#23234a'};border-radius:10px;padding:5px"><canvas data-map="${i}" width="110" height="110" style="width:100%"></canvas><div style="font-size:11px;font-weight:700">${m.name}</div><div class="sub" style="font-size:10px">${r.g?`${r.o.w}V ${r.o.l}D · ${Math.round(r.wr*100)}%`:'sem jogos'}</div>${t.tag=='best'?'<div style="font-size:10px;color:#37d67a">★ Melhor mapa</div>':t.tag=='worst'?'<div style="font-size:10px;color:#ff4d6d">▼ Pior mapa</div>':''}</div>`}).join('')}</div></div>`}
function teamV(){const sub=[['mkt','Mercado'],['sq','Elenco'],['ag','Agentes']],t=tab;tab=tsub;let inner='';try{inner=view()}finally{tab=t}
 return`<button class="g" style="margin-bottom:8px" onclick="tab='home';draw();scrollTo(0,0)">← Voltar</button>${bn('team','TIME')}<div class="row" style="gap:6px;margin-bottom:10px">${sub.map(([k,l])=>`<button class="${tsub==k?'':'g'}" style="flex:1" onclick="tsub='${k}';draw()">${l}</button>`).join('')}</div>`+inner}
const msgOf=r=>(r.j&&(r.j.message||r.j.msg))||String(r.j||r.s);
async function rp(n,b){const t=await tok();if(!t)return{ok:false,s:401,j:'login'};return sb('/rest/v1/rpc/'+n,{method:'POST',body:JSON.stringify(b||{})},t)}
function okJoin(){if(!S.mod){ON.msg='Compre a modalidade Voltrix Tactical primeiro.';draw();return false}if(S.st.length<5){ON.msg='Escolha 5 titulares em Time > Elenco.';draw();return false}if(S.money<TAXA){ON.msg='Saldo insuficiente: a inscrição custa '+fm(TAXA)+'.';draw();return false}return true}
async function loadOnline(){if(!SS)return;const r=await rp('t_listar');ON.list=r.ok&&Array.isArray(r.j)?r.j:[];if(ON.cur)await viewT(ON.cur,1);if(tab=='onl'&&!M)draw()}
async function viewT(id,q){const r=await rp('t_ver',{p_id:id});if(r.ok&&r.j&&r.j.t){ON.det=r.j;ON.cur=id}else{ON.det=null;ON.cur=null}if(!q||(tab=='onl'&&!M))draw()}
async function createT(){const v=+document.getElementById('tv').value;if(!okJoin())return;const s=snapT(),r=await rp('t_criar',{p_vagas:v,p_equipe:s.equipe,p_pais:s.pais,p_elenco:s.elenco,p_estr:s.estr});
 if(r.ok&&typeof r.j=='number'){tx('Inscrição: torneio online #'+r.j,-TAXA);save();ON.msg='Torneio criado! Chame outros jogadores para entrar.';await viewT(r.j);loadOnline()}else{ON.msg='Erro ao criar: '+msgOf(r);draw()}}
async function joinT(id){if(!okJoin())return;const s=snapT(),r=await rp('t_entrar',{p_id:id,p_equipe:s.equipe,p_pais:s.pais,p_elenco:s.elenco,p_estr:s.estr});
 if(r.ok&&r.j=='ok'){tx('Inscrição: torneio online #'+id,-TAXA);save();ON.msg='Inscrição feita!'}else ON.msg='Não foi possível entrar: '+msgOf(r);await viewT(id);loadOnline()}
async function startT(id){const r=await rp('t_iniciar',{p_id:id});ON.msg=r.ok&&r.j=='ok'?'Torneio iniciado!':'Erro: '+msgOf(r);await viewT(id);loadOnline()}
function togBan(i){const k=ON.vb.indexOf(i);if(k>=0)ON.vb.splice(k,1);else if(ON.vb.length<2)ON.vb.push(i);draw()}
async function confBan(pid){if(ON.vb.length!=2)return;const r=await rp('t_banir',{p_part:pid,p_bans:ON.vb});ON.msg=r.ok&&r.j=='ok'?'Bans enviados ✓':'Erro: '+msgOf(r);ON.vp=null;ON.vb=[];await viewT(ON.cur)}
async function claimPrize(id){const r=await rp('t_premio',{p_id:id});if(r.ok&&+r.j>0){tx('Prêmio do torneio online #'+id,+r.j);save();ON.msg='Prêmio de '+fm(+r.j)+' recebido!'}else ON.msg='Nada a resgatar.';await viewT(id)}
async function playOnline(pid){const r=await rp('t_partida',{p_id:pid});if(!r.ok||!r.j||r.j.mapa==null){ON.msg='Partida indisponível agora.';draw();return}
 const d=r.j;startMatch({a:0,b:1},false,{id:d.id,seed:d.seed,mapa:d.mapa,side:d.eu==d.a_id?'A':'B',A:d.A,B:d.B})}
async function finishOnline(){const a=M.sc[0],b=M.sc[1],on=M.on,me=on.side;
 const log={map:M.mapId,seed:on.seed,score:[a,b],rounds:M.rlog||[],kills:M.events.map(e=>[e.rnd,e.time,e.kt=='mine'?'A':'B',e.k,e.v,e.w,e.hs?1:0,e.ab?e.ab.n:0]),A:M.mine.map((p,i)=>[p.n,M.stats[i].k,M.stats[i].d,M.stats[i].as]),B:M.E.map((p,i)=>[p.n,M.es[i].k,M.es[i].d,M.es[i].as])};
 S.seen=S.seen||{};if(!S.seen[on.id]){S.seen[on.id]=1;const mw=me=='A'?a>b:b>a;mapStat(M.mapId,mw,me=='A'?a:b,me=='A'?b:a);save()}
 let res='sem conexão';try{const r=await rp('t_enviar',{p_part:on.id,p_a:a,p_b:b,p_log:log});res=r.ok?String(r.j):'erro '+r.s}catch(e){}
 const txt={ok:'resultado oficial registrado ✓',confirmado:'resultado confirmado ✓ (igual ao oficial)',divergente:'⚠ seu resultado divergiu do oficial; vale o oficial'}[res]||res;
 const ov=document.getElementById('ov');if(ov)ov.remove();M=null;ON.msg=`Partida ${a} x ${b}: ${txt}`;tab='onl';await loadOnline();draw()}
const RN_=(r,R)=>r==R?'Final':r==R-1?'Semifinal':r==R-2?'Quartas de final':'Rodada '+r;
function onlV(){let o=bn('onl','TORNEIO ONLINE');if(ON.msg)o+=`<div class="card">${esc(ON.msg)}</div>`;
 if(ON.cur&&ON.det){const d=ON.det,t=d.t,tm={};d.times.forEach(x=>tm[x.j]=x);const nm=j=>j&&tm[j]?`${fl(tm[j].pa)} ${esc(tm[j].eq)} <span class="sub">(${esc(tm[j].ap)})</span>`:'<span class="sub">a definir</span>';
  const ST={aberto:'Inscrições abertas',andamento:'Em andamento',finalizado:'Finalizado'}[t.status]||t.status;
  o+=`<div class="card"><div class="row"><b>Torneio #${t.id}</b><button class="g" onclick="ON.cur=null;ON.det=null;ON.vp=null;draw()">← Lista</button></div><div class="sub" style="margin-top:4px">${ST} · ${d.times.length}/${t.vagas} equipes · taxa ${fm(t.taxa)}${t.rodadas?' · '+t.rodadas+' fase(s)':''}</div>`;
  if(t.status=='aberto'){o+=`<div style="margin-top:8px">${d.times.map(x=>`<div class="sub">${fl(x.pa)} ${esc(x.eq)} (${esc(x.ap)})</div>`).join('')}</div>`;const meu=d.times.some(x=>x.j==d.eu);
   o+=`<div class="row" style="margin-top:10px">${meu?'<span class="tag">Você está inscrito</span>':`<button onclick="joinT(${t.id})">Entrar (${fm(t.taxa)})</button>`}${d.souc&&d.times.length>=2?`<button class="g" onclick="startT(${t.id})">Iniciar agora</button>`:''}</div>`}
  if(t.status=='finalizado'&&t.campeao)o+=`<div style="margin:8px 0">🏆 Campeão: ${nm(t.campeao)}</div>`;
  if(d.premio>0)o+=`<button style="width:100%;margin-top:8px" onclick="claimPrize(${t.id})">Resgatar prêmio ${fm(d.premio)}</button>`;
  o+='</div>';
  if(t.rodadas){const byR={};d.partidas.forEach(p=>(byR[p.r]=byR[p.r]||[]).push(p));
   Object.keys(byR).forEach(r=>{o+=`<div class="card"><b>${RN_(+r,t.rodadas)}</b>`;byR[r].forEach(p=>{const mine=p.a==d.eu||p.b==d.eu;let ac='';
    const stx={espera:'aguardando',veto:'picks e bans',pendente:'liberada',jogada:p.bye?'avançou (bye)':'jogada'}[p.st]||p.st;
    if(mine&&p.a&&p.b){if(p.st=='veto'){const my=p.a==d.eu?p.ba:p.bb;ac=(my&&my.length==2)?'<span class="sub">Bans enviados, aguardando o adversário</span>':`<button onclick="ON.vp=${p.id};ON.vb=[];draw()">Banir mapas</button>`}
     else if(p.st=='pendente'||p.st=='jogada')ac=`<button onclick="playOnline(${p.id})">${p.st=='jogada'?'▶ Rever partida':'▶ Jogar'}</button>`}
    o+=`<div style="margin-top:8px;${mine?'border-left:3px solid var(--ac);padding-left:8px':''}"><div class="row"><span>${nm(p.a)} <span class="sub">x</span> ${nm(p.b)}</span><b>${p.st=='jogada'&&!p.bye?p.pa+' x '+p.pb:''}</b></div><div class="sub">${stx}${p.mapa!=null?' · '+esc(MAPS[p.mapa].name):''}</div>${ac?`<div style="margin-top:6px">${ac}</div>`:''}</div>`;
    if(ON.vp==p.id){const ob=p.a==d.eu?p.bb:p.ba;o+=`<div style="margin-top:8px"><div class="sub">Escolha 2 mapas para banir (${ON.vb.length}/2). O jogo sorteia um dos 2 últimos.</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px">${MAPS.map((m,i)=>{const blocked=(ob||[]).includes(i),sel=ON.vb.includes(i),tg=mapTag(i);return`<div onclick="${blocked?'':'togBan('+i+')'}" style="text-align:center;border:2px solid ${sel?'#ff4d6d':blocked?'#555':'#23234a'};border-radius:10px;padding:4px;opacity:${blocked?.4:1}"><canvas data-map="${i}" width="110" height="110" style="width:100%"></canvas><div style="font-size:11px;font-weight:700">${m.name}</div><div class="sub" style="font-size:10px">${tg.r.g?Math.round(tg.r.wr*100)+'% rounds':'sem dados'}${tg.tag=='best'?' ★':tg.tag=='worst'?' ▼':''}</div>${blocked?'<div style="font-size:10px">banido pelo rival</div>':sel?'<div style="font-size:10px;color:#ff4d6d">BANIR</div>':''}</div>`}).join('')}</div><button style="width:100%;margin-top:8px" ${ON.vb.length==2?'':'disabled'} onclick="confBan(${p.id})">Confirmar bans</button></div>`}});o+='</div>'})}
  return o}
 o+=`<div class="card"><b>Criar torneio</b><div class="sub" style="margin:4px 0">Inscrição de ${fm(TAXA)} por equipe. Com 2 equipes é só a final, com 4 tem semifinal, e assim por diante, até 12 equipes. O elenco e as estratégias ficam travados na inscrição.</div><select id="tv">${[2,4,6,8,10,12].map(n=>`<option value="${n}">${n} equipes</option>`).join('')}</select><button style="width:100%;margin-top:6px" onclick="createT()">Criar (${fm(TAXA)})</button></div>`;
 o+=`<div class="card"><div class="row"><b>Torneios</b><button class="g" onclick="loadOnline()">Atualizar</button></div>`+(ON.list===null?'<div class="sub" style="margin-top:6px">Carregando...</div>':ON.list.length?ON.list.map(t=>`<div class="row" style="margin-top:8px"><div>#${t.out_id} · ${t.out_n}/${t.out_vagas} equipes<br><span class="sub">${{aberto:'abertas as inscrições',andamento:'em andamento',finalizado:'finalizado'}[t.out_status]||t.out_status}${t.out_meu?' · você participa':''}${t.out_campeao?' · 🏆 '+esc(t.out_campeao):''}</span></div><button class="g" onclick="viewT(${t.out_id})">Ver</button></div>`).join(''):'<div class="sub" style="margin-top:6px">Nenhum torneio ainda. Crie o primeiro!</div>')+'</div>';
 return o}
async function finishOnlineDummy(){}
function admV(){return`<div class="card" style="border-color:#ffd02d"><b>Painel ADM</b><input id="gap" placeholder="Apelido do jogador" autocapitalize="off"><select id="gtp" onchange="document.getElementById('gch').style.display=this.value=='jogador'?'block':'none';document.getElementById('gq').style.display=this.value=='jogador'?'none':'block'"><option value="moedas">Moedas</option><option value="caixas">Caixas</option><option value="jogador">Personagem</option></select><select id="gch" style="display:none">${Object.entries(ADMS).map(([id,v])=>`<option value="${id}">${v[0]} (${v[1]})</option>`).join('')}</select><input id="gq" type="number" placeholder="Quantidade"><button onclick="admGive()">Enviar presente</button><div id="gm" class="sub" style="margin-top:6px"></div>
<hr style="border:0;border-top:1px solid #333;margin:12px 0"><b>Limpar conta</b><div class="sub">Remove os jogadores, o dinheiro e o win rate da conta.</div><input id="lap" placeholder="Apelido da conta" autocapitalize="off"><button class="g" style="width:100%;color:#ff4d6d" onclick="admLimpar()">Limpar conta</button><div id="lam" class="sub" style="margin-top:6px"></div>
<hr style="border:0;border-top:1px solid #333;margin:12px 0"><button class="g" style="width:100%;color:#ff4d6d" onclick="admZero()">Zerar rank GLOBAL (todos os jogadores)</button></div>`}
async function admGive(){const ap=document.getElementById('gap').value.trim(),tp=document.getElementById('gtp').value,e=document.getElementById('gm');let q=parseInt(document.getElementById('gq').value);if(tp=='jogador')q=parseInt(document.getElementById('gch').value);if(!ap||!(q>0)){e.textContent='Preencha o apelido e a quantidade';return}e.textContent='Enviando...';
 try{const r=await rp('dar_presente',{p_apelido:ap,p_tipo:tp,p_qtd:q});e.textContent=r.ok?(r.j=='ok'?'Enviado ✓':String(r.j)):'Negado ou erro ('+r.s+'): '+msgOf(r)}catch(x){e.textContent='Sem conexão'}}
async function admLimpar(){const ap=document.getElementById('lap').value.trim(),e=document.getElementById('lam');if(!ap)return;if(!confirm('LIMPAR a conta de '+ap+'? Ela perde jogadores, dinheiro e win rate.'))return;try{const r=await rp('adm_limpar_conta',{p_apelido:ap});e.textContent=r.ok?(r.j=='ok'?'Conta limpa ✓ (o jogo dela aplica ao abrir)':String(r.j)):'Negado ou erro ('+r.s+'): '+msgOf(r)}catch(x){e.textContent='Sem conexão'}}

async function admZero(){if(!confirm('ZERAR O RANK GLOBAL de todos os jogadores? Isso não pode ser desfeito.'))return;const e=document.getElementById('gm');try{const t=await tok();const r=await sb('/rest/v1/rpc/zerar_rank_global',{method:'POST',body:'{}'},t);if(e)e.textContent=r.ok&&r.j=='ok'?'Rank global zerado ✓ (ranking e ligas de todos os jogadores reiniciados)':'Falhou ('+r.s+'): '+((r.j&&(r.j.message||r.j.msg))||'rode o SQL de correção');if(r.ok)checkTemp();loadRank()}catch(x){if(e)e.textContent='Sem conexão'}}
async function zerarRank(){if(!confirm('Zerar o seu rank? Suas vitórias, derrotas e títulos no ranking mundial voltam a 0, sua liga volta para Bronze e o torneio atual é reiniciado.'))return;try{const t=await tok();const r=await sb('/rest/v1/rpc/zerar_meu_rank',{method:'POST',body:'{}'},t);if(r.ok){S.liga=0;S.tn=null;try{localStorage.setItem('hv_q','[]')}catch(e){}save();ghostDirty=1;lastSend='rank zerado';loadRank();draw()}else alert('Erro ao zerar ('+r.s+'): '+((r.j&&(r.j.message||r.j.msg))||''))}catch(e){alert('Sem conexão')}}
let ghostDirty=1;
async function checkTemp(){if(!SS)return;try{const t=await tok();if(!t)return;const r=await sb('/rest/v1/rpc/temporada_atual',{method:'POST',body:'{}'},t);if(r.ok&&typeof r.j=='number'){const cur=S.temp===undefined?1:S.temp;if(cur!==r.j){S.liga=0;S.tn=null;try{localStorage.setItem('hv_q','[]')}catch(e){}ghostDirty=1;S.bxmsg='🔄 O rank global foi zerado: sua liga voltou para o Bronze.'}S.temp=r.j;save();if(!M)draw()}}catch(e){}}
setInterval(checkTemp,300000);
async function fetchGhosts(){if(!SS)return;try{const t=await tok();if(!t)return;const r=await sb('/rest/v1/rpc/buscar_fantasmas',{method:'POST',body:JSON.stringify({p_liga:LG[S.liga].n.toLowerCase(),p_n:8})},t);if(r.ok&&Array.isArray(r.j))localStorage.setItem('hv_gh',JSON.stringify(r.j))}catch(e){}}
async function saveGhost(){if(!SS||!ghostDirty||S.st.length<5)return;try{const t=await tok();if(!t)return;ghostDirty=0;const el=S.st.map(P).map(p=>({n:p.n,f:p.f,ovr:Math.round(p.ovr),a:Object.fromEntries(AK.map(k=>[k,Math.round(p.a[k])]))}));await sb('/rest/v1/rpc/salvar_fantasma',{method:'POST',body:JSON.stringify({p_equipe:S.org,p_pais:S.cc,p_liga:LG[S.liga].n.toLowerCase(),p_ovr:teamOvr(),p_elenco:el})},t)}catch(e){ghostDirty=1}}
setInterval(saveGhost,30000);setInterval(fetchGhosts,300000);

setInterval(claimGifts,60000);

applyTheme();load();draw();if(SS){checkAdmin();claimGifts();checkTemp();fetchGhosts();saveGhost()}
</script></body></html>
