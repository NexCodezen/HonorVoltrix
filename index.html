async function admZero(){if(!confirm('ZERAR O RANK GLOBAL de todos os jogadores? Isso não pode ser desfeito.'))return;const e=document.getElementById('gm');try{const t=await tok();const r=await sb('/rest/v1/rpc/zerar_rank_global',{method:'POST',body:'{}'},t);if(e)e.textContent=r.ok&&r.j=='ok'?'Rank global zerado ✓':'Negado ou erro ('+r.s+')';loadRank()}catch(x){if(e)e.textContent='Sem conexão'}}
async function zerarRank(){if(!confirm('Zerar o seu rank? Suas vitórias, derrotas e títulos no ranking mundial voltam a 0, sua liga volta para Bronze e o torneio atual é reiniciado.'))return;try{const t=await tok();const r=await sb('/rest/v1/rpc/zerar_meu_rank',{method:'POST',body:'{}'},t);if(r.ok){S.liga=0;S.tn=null;try{localStorage.setItem('hv_q','[]')}catch(e){}save();ghostDirty=1;lastSend='rank zerado';loadRank();draw()}else alert('Erro ao zerar ('+r.s+')')}catch(e){alert('Sem conexão')}}
